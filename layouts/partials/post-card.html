<article
  class="post-card"
  data-category="{{ delimit .Params.categories " " }}"
  data-tags="{{ delimit .Params.tags " " }}"
  data-title="{{ .Title }}"
  data-url="{{ .RelPermalink }}"
  data-date="{{ .Date.Format "2006-01-02" }}"
>
  <div class="post-meta">
    <span class="category">{{ index .Params.categories 0 | default "随笔" }}</span
    ><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time
    >{{ if .Params.featured }}<span class="featured-label">↗ 精选</span>{{ end }}
  </div>
  <h3>
    <a href="{{ .RelPermalink }}">{{ .Title }}<span class="post-arrow">↗</span></a>
  </h3>
  <p>{{ .Description | default .Summary | plainify | truncate 110 }}</p>
  <div class="post-bottom">
    <div class="post-tags">
      {{ range first 3 .Params.tags }}
        <a href="{{ printf "/tags/%s/" (. | urlize) }}"># {{ . }}</a>
      {{ end }}
    </div>
    <span
      >{{ .ReadingTime }} 分钟阅读
      <button
        class="bookmark-button"
        data-bookmark="{{ .RelPermalink }}"
        data-title="{{ .Title }}"
        aria-label="收藏 {{ .Title }}"
        aria-pressed="false"
      >
        {{ partial "icon.html" "bookmark" }}
      </button></span
    >
  </div>
</article>
