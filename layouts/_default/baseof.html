<!doctype html>
<html lang="zh-CN">
  {{ partial "shell/head.html" . }}
  <body data-page="{{ .Params.pageKind | default .Section }}">
    <a class="skip-link" href="#main">跳至正文</a>
    <div class="reading-progress" aria-hidden="true"></div>
    {{ partial "shell/sidebar.html" . }}
    <div class="site-shell">
      {{ partial "shell/topbar.html" . }}
      <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
      {{ partial "shell/footer.html" . }}
    </div>
    <button class="back-top icon-button" data-action="top" aria-label="回到顶部">↑</button>
    {{ partial "shell/dialogs.html" . }}
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
