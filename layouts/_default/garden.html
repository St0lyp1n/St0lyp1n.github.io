{{ define "main" }}
  {{ partial "page-heading.html" . }}
  {{ $view := printf "pages/%s.html" (.Params.pageKind | default "default") }}
  {{ if templates.Exists (printf "partials/%s" $view) }}
    {{ partial $view . }}
  {{ else }}
    <div class="prose standalone">{{ .Content }}</div>
  {{ end }}
{{ end }}
