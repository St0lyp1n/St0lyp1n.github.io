{{ define "main" }}
  <div class="page-intro">
    <div class="eyebrow">FOLLOW YOUR CURIOSITY</div>
    <h1>{{ if eq .Data.Plural "tags" }}沿着标签，发现关联。{{ else }}从一个主题开始。{{ end }}</h1>
    <p>同一个问题，也许藏在不同的文字里。</p>
  </div>
  <a class="back-link" href="/posts/">← 返回所有文章</a>
  <div class="tag-cloud">
    {{ range .Data.Terms.Alphabetical }}
      <a href="{{ .Page.RelPermalink }}"
        >{{ if eq $.Data.Plural "tags" }}#{{ end }}{{ .Page.Title }}
        <small>{{ .Count }} 篇</small></a
      >
    {{ end }}
  </div>
{{ end }}
